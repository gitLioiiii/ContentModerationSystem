spring.ai.ollama.base-url=https://ollama.com
# 自定义认证token（云端需要通过 OllamaConfig 配置类使用）
ollama.auth.bearer-token=99ebf30eac79485089995ffccddefb37.gu8Y2XSqKnzntgNr4YPPZHNd
spring.ai.ollama.chat.options.model=qwen3.5:cloud
