# spring.data.mongodb.database=content_moderation
spring.data.mongodb.uri=mongodb://root:742903@47.86.13.34:27017/mongodb?authSource=admin
# 使用URI连接字符串
# spring.data.mongodb.uri=mongodb://root:742903@localhost:27017/content_moderation


# 需要在pom引入spring-boot-configuration-processor，还有配置绑定类configuration/UploadConfiguration.java和UploadController.java
# 要使照片上传独立在项目外
# spring内置的tomcat对照片大小有限制
# application.upload-root=D:\\Project\\upload
application.upload-root=/www/wwwroot/lyqy886.xyz/uploads
# 配置静态资源映射，让上传的文件可以通过HTTP访问
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/static/,classpath:/public/,classpath:/resources/,file:${application.upload-root}

# 上传大小限制（解决 413 Payload Too Large）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 增加超时时间以支持视频处理
# 1分钟等于6万毫秒
server.tomcat.connection-timeout=300000
spring.mvc.async.request-timeout=300000

# Redis 缓存配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=742903

# 视频审核并行处理（线程池）
# 任务执行
spring.task.execution.mode=force
spring.task.execution.pool.core-size=6
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=10s
spring.task.execution.thread-name-prefix=video-task-
